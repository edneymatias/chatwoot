# #
# # This action will publish Chatwoot EE docker image.
# # This is set to run against merges to develop, master
# # and when tags are created.
# #

name: Publish Chatwoot EE docker images

on:
  push:
    tags:
      - '*-ichatr.*'
  workflow_dispatch:

env:
  DOCKER_REPO: edneymatias/ichatr

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      GIT_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile



      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG_VERSION="${DOCKER_REPO}:${{ github.ref_name }}"
          TAG_LATEST="${DOCKER_REPO}:latest"
          
          docker buildx imagetools create -t $TAG_VERSION -t $TAG_LATEST \
            $(printf '${{ env.DOCKER_REPO }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          TAG_VERSION="${DOCKER_REPO}:${{ github.ref_name }}"
          
          docker buildx imagetools inspect $TAG_VERSION

  release_notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Changelog Range
        id: compute-range
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE_VERSION=$(jq -r .version package.json)
          TAG_PREFIX="${BASE_VERSION}-ichatr."
          
          PREVIOUS_TAG=$(git tag -l "${TAG_PREFIX}*" | grep -v "^${TAG}$" | sort -V | tail -n 1)
          
          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="v${BASE_VERSION}..${TAG}"
          else
            RANGE="${PREVIOUS_TAG}..${TAG}"
          fi
          
          echo "Computed range: $RANGE"
          echo "range=$RANGE" >> $GITHUB_OUTPUT

      - name: Generate Changelog with git-cliff
        id: git-cliff
        uses: orhun/git-cliff-action@v3
        with:
          args: ${{ steps.compute-range.outputs.range }}

      - name: Handle Empty Changelog and Prepend
        id: process-changelog
        run: |
          NOTES="${{ steps.git-cliff.outputs.content }}"
          
          # T010b: Default fallback if empty
          if [ -z "$NOTES" ] || ! echo "$NOTES" | grep -q "[a-zA-Z]"; then
             NOTES="No notable changes."
          fi
          
          # T011: Prepend to CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            echo -e "$NOTES\n" | cat - CHANGELOG.md > temp && mv temp CHANGELOG.md
          else
            echo -e "$NOTES\n" > CHANGELOG.md
          fi
          
          # Save notes for gh release
          echo "$NOTES" > release_notes.md

      - name: Commit CHANGELOG.md to ichatr-main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update changelog for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:ichatr-main
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release_notes.md
